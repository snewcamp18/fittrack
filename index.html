<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1214">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>FitTrack</title>
<style>
  :root {
    --bg: #0f1214; --card: #181c20; --card2: #20262b; --line: #2a3137;
    --text: #eef1f3; --muted: #8a949c; --accent: #3ddc84; --accent-ink: #062b16; --hot: #ff9f43; --danger: #ff6b5a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 96px); }
  body.has-rest main { padding-bottom: calc(env(safe-area-inset-bottom) + 160px); }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 18px; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-bottom: 4px; }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 8px 0 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card > * + * { margin-top: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .two .field { margin: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row.end { justify-content: flex-end; }
  button { font: inherit; color: inherit; border: 0; border-radius: 12px; padding: 12px 16px; background: var(--card2); cursor: pointer; }
  button:active { transform: scale(.98); }
  .primary { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .ghost { background: transparent; border: 1px solid var(--line); }
  .danger { background: transparent; color: var(--danger); border: 1px solid #5a2d28; }
  .link { background: none; color: var(--muted); padding: 8px 0; text-decoration: underline; font-size: 14px; }
  .wide { width: 100%; display: block; margin-top: 12px; }
  button.small { padding: 8px 12px; font-size: 14px; }
  .tile { text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 16px; border-radius: 16px; background: var(--card); }
  input, select { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field { display: block; font-size: 14px; color: var(--muted); margin-top: 12px; }
  .field input, .field select { margin-top: 4px; }

  .week { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .week > * + * { margin-top: 0; }
  .week > div:first-child { flex: 1; min-width: 0; }
  .big { font-size: 34px; font-weight: 800; margin-top: 4px; }
  .big span { font-size: 16px; font-weight: 500; }
  .dots { display: flex; gap: 4px; margin-top: 8px; }
  .dots i { flex: 1; max-width: 22px; height: 8px; border-radius: 4px; background: var(--card2); }
  .dots i.on { background: var(--accent); }
  .streak { text-align: center; display: flex; flex-direction: column; background: var(--card2); border-radius: 14px; padding: 10px 14px; }
  .streak b { font-size: 28px; color: var(--accent); }
  .plan { list-style: none; padding: 0; margin: 10px 0 0; }
  .plan li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .plan li span:last-child { text-align: right; white-space: nowrap; }
  .plan li:last-child { border-bottom: 0; }
  .banner { background: #143322; color: var(--accent); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-weight: 600; }
  .slot.isdone { opacity: .75; }
  .donetag { color: var(--accent); font-weight: 700; font-size: 14px; }

  .exhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .hint { font-size: 14px; color: var(--accent); }
  .tag { font-size: 12px; color: var(--hot); font-weight: 600; }
  .set { display: grid; grid-template-columns: 24px 1fr 1fr 52px; gap: 8px; align-items: center; }
  .set + .set { margin-top: 8px; }
  .setn { color: var(--muted); text-align: center; font-weight: 700; }
  .set label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .set input { text-align: center; padding: 10px 4px; font-size: 18px; font-weight: 600; }
  .check { height: 46px; padding: 0; font-size: 20px; font-weight: 800; color: var(--muted); }
  .set.done .check { background: var(--accent); color: var(--accent-ink); }
  .set.done input { border-color: #1e6b41; }

  .player { text-align: center; border: 2px solid transparent; }
  .player.hard { border-color: var(--hot); }
  .pstep { font-size: 26px; }
  .ptime { font-size: 76px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; margin-top: 14px !important; }
  .player.hard .ptime { color: var(--hot); }
  .player.ready .ptime { color: var(--muted); }
  .bigclock { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 4px; }
  .bigclock span { font-size: 15px; font-weight: 500; color: var(--muted); }
  .warm { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .warm b { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pbar { height: 6px; background: var(--card2); border-radius: 3px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--accent); width: 0; }
  .player.hard .pbar i { background: var(--hot); }
  .pctl { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; margin-top: 16px !important; }
  .pctl button { font-size: 18px; padding: 16px; }
  .steps { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  .steps li { display: flex; justify-content: space-between; padding: 6px 4px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .steps li.cur { color: var(--accent); font-weight: 700; }
  .steps li.past { opacity: .5; }

  #rest { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 64px); display: flex; justify-content: center; padding: 0 16px; z-index: 5; }
  #rest[hidden] { display: none; }
  #rest .bar { width: 100%; max-width: 528px; display: flex; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 10px 12px 10px 16px; box-shadow: 0 8px 24px #0008; }
  #rest b { font-size: 24px; font-variant-numeric: tabular-nums; flex: 1; }
  #rest button { background: #0002; color: inherit; font-weight: 700; padding: 8px 12px; }

  nav#tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; background: #0f1214f2; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
  nav#tabs[hidden] { display: none; }
  nav#tabs .in { display: flex; width: 100%; max-width: 560px; }
  nav#tabs button { flex: 1; background: none; border-radius: 0; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
  nav#tabs button.on { color: var(--accent); }
  nav#tabs svg { width: 24px; height: 24px; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .stat { background: var(--card); border-radius: 16px; padding: 14px 16px; }
  .stat b { display: block; font-size: 26px; font-weight: 800; }
  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-size: 10px; }
  .entries { list-style: none; padding: 0; margin: 0; }
  .entries li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .entries li:last-child { border-bottom: 0; }
  .x { background: none; color: var(--muted); padding: 4px 10px; font-size: 18px; }
  .ladder { list-style: none; padding: 0; margin: 0; counter-reset: lv; }
  .ladder li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0 8px 32px; border-bottom: 1px solid var(--line); position: relative; color: var(--muted); }
  .ladder li:last-child { border-bottom: 0; }
  .ladder li::before { counter-increment: lv; content: counter(lv); position: absolute; left: 0; top: 7px; width: 22px; height: 22px; border-radius: 50%; background: var(--card2); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .ladder li.done { color: var(--text); }
  .ladder li.done::before { content: "✓"; background: #143322; color: var(--accent); }
  .ladder li.cur { color: var(--accent); font-weight: 700; }
  .ladder li.cur::before { background: var(--accent); color: var(--accent-ink); }
  .feel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 16px !important; }
  .feel button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px; font-size: 11px; }
  .feel button b { font-size: 26px; }
  .sched td { padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
  .sched { width: 100%; border-collapse: collapse; }
  .sched td:first-child { color: var(--muted); font-weight: 600; width: 52px; }

  .weekhead { font-size: 13px; color: var(--muted); font-weight: 600; margin: 18px 4px 8px; }
  details.card summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::after { content: "›"; color: var(--muted); font-size: 22px; transition: transform .2s; }
  details[open].card summary::after { transform: rotate(90deg); }
  summary div { display: flex; flex-direction: column; }
  .exlines { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  .exlines li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .exlines li span:last-child { color: var(--muted); text-align: right; }
  .empty { text-align: center; padding: 24px 8px; }

  #sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
  #sheet[hidden] { display: none; }
  #sheet .scrim { position: absolute; inset: 0; background: #000a; }
  #sheetBox { position: relative; width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; background: var(--card); border-radius: 20px 20px 0 0; padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px); }
  #sheetBox .row.end { margin-top: 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { padding: 7px 12px; font-size: 14px; border-radius: 999px; }
  .chip.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .pick { display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; margin-top: 8px; }
  #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translate(-50%, -120px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; transition: transform .25s; z-index: 20; max-width: calc(100% - 32px); }
  #toast.show { transform: translate(-50%, 0); }

  .onboard { padding-top: 24px; }
  .onboard .logo { width: 64px; height: 64px; margin-bottom: 16px; }
  .onboard > p { margin: 10px 0 20px; }
  .celebrate { text-align: center; }
  .celebrate .emoji { font-size: 56px; }
  .celebrate h2 { font-size: 24px; margin: 8px 0; }
  .prs { color: var(--accent); font-weight: 600; margin-top: 10px; }
</style>
</head>
<body>
<main id="view"></main>
<div id="rest" hidden></div>
<nav id="tabs" hidden><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Today</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>History</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg>Progress</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</div></nav>
<div id="sheet" hidden><div class="scrim" data-act="close"></div><div id="sheetBox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
/* FitTrack — everything is stored in localStorage on this device.
 * Data: settings, workouts (strength, timed and cardio sessions, sorted by `at`; `slot` is am/pm when started from
 * today's plan), weights (one per day), checkins (hip/back tightness 1–5, one per day), hspu (handstand ladder level),
 * active (strength workout in progress). A timed session in progress lives only in memory (P). */
const KEY = 'fittrack-v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = (d = new Date()) => { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` };
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) };
const monday = d => { d = new Date(d); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d };
const weekKey = d => ymd(monday(d));
const fmtDate = s => parseYmd(s).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const shortDate = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null };
const r1 = n => Math.round(n * 10) / 10;
const mmss = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
const distUnit = () => D.settings.unit === 'kg' ? 'km' : 'mi';
const repeat = (n, steps) => Array.from({ length: n }, (_, i) => typeof steps === 'function' ? steps(i) : steps).flat();

/* ---------- the program ----------
 * Two 15–20 minute sessions a day. Mornings: strength (supersets, so three or four lifts fit) or engine intervals.
 * Evenings: Low Back Ability — main Flow split into Flow A / Flow B, plus his Mobility Flow — or handstand skill work.
 * Built for: barbell + rack + bench, dumbbells, pull-up bar, rower, Echo bike, back extension, jump rope. */
const E = (n, s, r, o = {}) => ({ n, s, r, u: o.u || 'reps', w: !!o.w, t: o.t || '', ss: !!o.ss, ladder: !!o.ladder });
const LADDER = E('', 0, 0, { ladder: true });   // stands in for the current handstand push-up level
const HSPU = [
  E('Pike push-up', 3, 8, { t: 'Hips high, lower the top of your head to the floor just in front of your hands.' }),
  E('Feet-elevated pike push-up', 3, 8, { t: 'Feet on the bench, hips stacked over your shoulders as much as you can.' }),
  E('Wall handstand hold', 3, 30, { u: 'sec', t: 'Walk your feet up the wall, chest facing it, hands close to the wall. Squeeze glutes, push the floor away.' }),
  E('Wall HSPU negative', 3, 4, { t: 'Walk up, lower your head to a folded towel over 5 seconds, come down, repeat.' }),
  E('Partial wall HSPU', 3, 5, { t: 'Press back up from a stack of pads under your head. Take a pad away as you get stronger.' }),
  E('Wall handstand push-up', 3, 5, { t: 'Full range, head to the floor and back. This builds the pressing strength; balance comes from Tue/Thu practice.' }),
  E('Freestanding handstand hold', 3, 20, { u: 'sec', t: 'Kick up in open space. Only count clean holds — log your best hold for each set.' }),
  E('Freestanding HSPU negative', 3, 3, { t: 'Kick up, find balance, lower to a folded towel over 5 seconds. Bail out by cartwheeling.' }),
  E('Partial freestanding HSPU', 3, 3, { t: 'Press back up from a stack of pads. Take a pad away as you get stronger.' }),
  E('Freestanding handstand push-up', 3, 1, { t: 'Full range, no wall. You made it — keep adding reps.' })
];
const SESSIONS = {
  strA: { kind: 'strength', icon: '💪', name: 'Strength A', sub: 'Handstand press & squat', min: 22,
    warm: '4 min jump rope, then 2 light sets of squats.', warmSec: 240,
    ex: [{ ...LADDER, ss: true }, E('Back squat', 3, 5, { w: true }),
         E('Back extension', 2, 12, { w: true, ss: true, t: 'Hinge at the hips, squeeze glutes at the top, don’t over-arch. Hug a plate when 12 gets easy.' }),
         E('Hanging knee raise', 2, 10, { t: 'Slow and controlled, no swinging. Climbing core.' })] },
  strB: { kind: 'strength', icon: '🧗', name: 'Strength B', sub: 'Pull & hinge — climbing day', min: 22,
    warm: '4 min rope flow, then 5 scap pull-ups (hang and pull your shoulders down).', warmSec: 240,
    ex: [E('Pull-up', 4, 5, { ss: true, t: 'Can’t hit 5? Do what you can, then slow 5-second lowerings. Easy? Hold a dumbbell between your feet.' }),
         E('Romanian deadlift', 3, 8, { w: true, t: 'Push hips back, flat back, soft knees. Stop when your hamstrings stretch — not your low back.' }),
         E('Dead hang', 3, 30, { u: 'sec', ss: true, t: 'Grip strength for bouldering. Active shoulders: pull them slightly down.' }),
         E('Hollow body hold', 3, 20, { u: 'sec', t: 'Low back pressed into the floor the whole time.' })] },
  strC: { kind: 'strength', icon: '💪', name: 'Strength C', sub: 'Handstand press, bench & single leg', min: 22,
    warm: '4 min jump rope, then a light set of bench.', warmSec: 240,
    ex: [{ ...LADDER, ss: true }, E('Bench press', 3, 6, { w: true }),
         E('Bulgarian split squat', 2, 8, { w: true, ss: true, t: 'Back foot on the bench, dumbbells in hand. Reps per leg — stretches tight hip flexors too.' }),
         E('Seated good morning', 2, 10, { w: true, t: 'Low Back Ability style: sit on the bench, legs wide, hinge forward slowly and come back up. Start with just the bar or a light dumbbell and add a little at a time.' })] },
  eng1: { kind: 'timed', icon: '🔥', name: 'Engine: Row', sub: 'Rower intervals', cals: 'rower',
    about: ['4 min easy warm-up', '6 rounds: 1 min hard · 1 min easy', '2 min cool-down'],
    steps: [{ n: 'Easy row — warm up', s: 240 }, ...repeat(6, i => [{ n: 'Row hard', s: 60, hard: true, flow: i > 0, t: 'Hard but steady — you should finish every round.' }, { n: 'Row easy', s: 60, flow: true }]), { n: 'Easy row — cool down', s: 120, flow: true }] },
  // `move`: seconds to get from one station to the next (bike ↔ rope), used for that step's get-ready countdown
  eng2: { kind: 'timed', icon: '🔥', name: 'Engine: Bike & rope', sub: 'Echo bike + jump rope', cals: 'Echo bike',
    about: ['2 min rope flow', '2 min easy bike, building up', '6 rounds: 20 s bike sprint · 40 s easy spin · 1 min jump rope', '10 s to switch stations', '2 min easy spin'],
    steps: [{ n: 'Rope flow — warm up', s: 120 },
      { n: 'Easy bike — build up', s: 120, move: 10, t: 'Start easy and build to a moderate pace, so the first sprint isn’t a cold start.' },
      ...repeat(6, i => [{ n: 'Echo bike — all out', s: 20, hard: true, flow: i === 0, move: 10 }, { n: 'Easy spin', s: 40, flow: true }, { n: 'Jump rope', s: 60, move: 10 }]),
      { n: 'Easy spin — cool down', s: 120, move: 10 }] },
  // Low Back Ability's main session ("Flow"), split in two so each half fits an evening
  flowA: { kind: 'strength', icon: '🦵', name: 'LBA Flow A', sub: 'Low Back Ability — legs & knees', min: 17, checkin: true,
    ex: [E('Backward walk (sled warm-up)', 1, 60, { u: 'sec', t: 'No sled: walk backward, small steps, pushing through the balls of your feet. 10 m with a sled if you have one.' }),
         E('Tibialis raise', 2, 25, { w: true, t: 'Back against a wall, heels out, lift your toes as high as you can.' }),
         E('Deep calf raise', 2, 25, { w: true, t: 'Full stretch at the bottom off a step or plate.' }),
         E('Reverse step up', 2, 25, { w: true, t: 'Reps per side.' }),
         E('Full range split squat', 2, 10, { w: true, t: 'Reps per side. Knee travels forward over the toes.' })] },
  flowB: { kind: 'strength', icon: '🏋️', name: 'LBA Flow B', sub: 'Low Back Ability — upper back & trunk', min: 15, checkin: true,
    ex: [E('External rotation', 1, 15, { w: true, t: 'Reps per side. Light — band or small dumbbell.' }),
         E('Pullover', 2, 15, { w: true, t: 'Dumbbell on the bench.' }),
         E('Trap 3 raise', 2, 10, { w: true, t: 'Light dumbbells, chest on an incline bench.' }),
         E('Back extension', 1, 120, { u: 'sec', w: true, t: 'Two minutes of continuous reps on the back extension.' }),
         E('Hip flexor kick out', 2, 5, { t: 'Reps per side.' }),
         E('Side bend', 2, 12, { w: true, t: 'Reps per side.' })] },
  // Low Back Ability's supporting session. Rep-based moves get a time slot: tap ⏭ when you finish early.
  mobility: { kind: 'timed', icon: '🧘', name: 'LBA Mobility Flow', sub: 'Low Back Ability — hips & low back', checkin: true,

}
const stepLeft = () => P.paused ? Math.ceil(P.left / 1000) : Math.max(0, Math.ceil((P.end - Date.now()) / 1000));

}

/* ---------- progress ---------- */
function lineChart(pts, label, fixed) {
  if (pts.length < 2) return `<p class="muted small empty">Log at least two entries to see a trend.</p>`;
  const W = 320, H = 150, L = 36, R = 10, T = 10, B = 22;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 1 : Math.max(...xs);
  const lo = fixed ? fixed[0] : Math.min(...ys), hi = fixed ? fixed[1] : Math.max(...ys);
  const padY = (hi - lo) * 0.2 || Math.max(1, hi * 0.05), y0 = lo - padY, y1 = hi + padY;
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R), Y = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = `${line}L${X(pts.at(-1).x).toFixed(1)},${H - B}L${X(pts[0].x).toFixed(1)},${H - B}Z`;
  const ticks = fixed ? [fixed[0], (fixed[0] + fixed[1]) / 2, fixed[1]] : [lo, (lo + hi) / 2, hi];
  const grid = ticks.filter((v, i, a) => a.indexOf(v) === i).map(v =>
    `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${L - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${r1(v)}</text>`).join('');
  const last = pts.at(-1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${grid}
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length <= 30 ? pts.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.5" fill="var(--accent)"/>`).join('') : ''}
    <circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
    <text x="${L}" y="${H - 6}">${shortDate(pts[0].x)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${shortDate(last.x)}</text></svg>`;
}
function barChart(vals, labels, goal) {
  const W = 320, H = 130, T = 14, B = 20, n = vals.length, gap = 8, bw = (W - gap * (n - 1)) / n;
  const max = Math.max(goal, ...vals, 1), Y = v => T + (1 - v / max) * (H - T - B);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sessions per week">
    ${vals.map((v, i) => { const x = i * (bw + gap); return `<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - Y(v)).toFixed(1)}" rx="4" fill="var(--accent)" opacity="${v >= goal ? 1 : 0.35}"/>
      ${v ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(Y(v) - 4).toFixed(1)}" text-anchor="middle">${v}</text>` : ''}<text x="${(x + bw / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${labels[i]}</text>` }).join('')}
    <line x1="0" x2="${W}" y1="${Y(goal).toFixed(1)}" y2="${Y(goal).toFixed(1)}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".6"/></svg>`;
}

function convertUnits(to) {
  const k = to === 'kg' ? 1 / 2.20462 : 2.20462, km = to === 'kg' ? 1.60934 : 1 / 1.60934;
  const round = v => r1(Math.round(v * k / (to === 'kg' ? 0.5 : 1)) * (to === 'kg' ? 0.5 : 1));
  D.weights.forEach(w => w.v = r1(w.v * k));
  for (const w of D.workouts) {
    if (w.kind === 'cardio' && w.distance) w.distance = r1(w.distance * km);
    if (w.fb && w.fb.load) w.fb.load = round(w.fb.load);
    if (w.kind === 'strength') w.exercises.forEach(e => e.sets.forEach(s => { if (s.weight) s.weight = round(s.weight) }));
  }
  if (D.active) D.active.exercises.forEach(e => e.sets.forEach(s => { const v = num(s.weight); if (v) s.weight = round(v) }));
}
async function exportData() {
  const name = `fittrack-backup-${ymd()}.json`, blob = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia('(pointer: coarse)').matches) {

  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  pickAct(el) { $('#cKind').value = el.dataset.v; document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el)) },
  finish() { finishWorkout() },
  discard() { if (confirm('Discard this workout? Nothing from it will be saved.')) { D.active = null; save(); stopRest(); stopWarm(); letSleep(); render() } },
  rest30() { restEnd += 30000; drawRest() },
  restskip() { stopRest() },
  warm() { if (warmEnd) stopWarm(); else startWarm(SESSIONS[D.active.session].warmSec); scrollKeep(render) },
  ppause() {
    if (P.paused) { P.end = Date.now() + P.left; P.paused = false; keepAwake() } else { P.left = P.end - Date.now(); P.paused = true }
    render();
  },
  pnext() { stepTo(P.i + 1) },
  pprev() { stepTo(stepLeft() < P.steps[P.i].s - 3 ? P.i : P.i - 1) },
  pquit() { endSheet() },
  pdiscard() { if (!confirm('Discard this session? Nothing from it will be saved.')) return; clearInterval(pTick); pTick = null; P = null; letSleep(); closeSheet(); render(); toast('Session discarded') },
  psaveEnd() {
    const total = roundsOf(P.sid), rounds = Math.min(total, Math.max(0, parseInt($('#eRounds')?.value) || 0)), mins = Math.max(1, parseInt($('#eMin').value) || 1);
    const cal = parseInt($('#eCal')?.value) || 0;
    closeSheet(); finishTimed(false, { rounds, mins, cal });
  },
  fbSave(el) {
    const w = D.workouts.find(x => x.id === el.dataset.id);
    if (!el.dataset.skip) {
      const edge = parseInt($('#fbEdge').value), load = num($('#fbLoadIn').value) ?? 0;
      if (!(edge > 0)) { toast('Enter the edge size in mm'); return }
      const editing = !!w.fb;
      w.fb = { setup: $('#fbSetup').value, edge, grip: $('#fbGrip').value, load: r1(load), feel: +$('#fbFeel').value }; save();
      if (editing) { closeSheet(); render(); toast('Updated'); return }
    }
    const n = fbNext();
    celebrate(`${w.minutes} min`, [w.fb ? fbText(w.fb) : '', n && w.fb ? `Next time: ${fbLoad(n)} (${n.why})` : '']);
  },
  calSave(el) {
    const w = D.workouts.find(x => x.id === el.dataset.id), cal = parseInt($('#calIn').value);
    if (!el.dataset.skip && !(cal > 0)) { toast('Enter the calories, or tap Skip'); return }
    if (!el.dataset.skip) { w.cal = cal; save() }
    celebrate(`${w.minutes} min`, [w.cal ? calLine(w) : '']);
  },
  logPast(el) { logSheet(null, el.dataset.slot, el.dataset.sid) },
  editLog(el) { logSheet(el.dataset.id) },
  editFb(el) { fbSheet(el.dataset.id) },
  saveLog(el) {
    const sid = $('#lSid').value, date = $('#lDate').value || ymd(), mins = parseInt($('#lMin').value), total = roundsOf(sid);
    if (!(mins > 0)) { toast('Enter how many minutes'); return }
    const rounds = Math.min(total, Math.max(0, parseInt($('#lRounds').value) || 0));
    const cal = SESSIONS[sid].cals ? parseInt($('#lCal').value) || 0 : 0;
    const fields = { session: sid, date, minutes: mins, complete: !total || rounds >= total, ...(total ? { rounds, roundsTotal: total } : { rounds: undefined, roundsTotal: undefined }), cal: cal > 0 ? cal : undefined };
    const old = el.dataset.id && D.workouts.find(w => w.id === el.dataset.id);
    if (old) {
      if (old.date !== date) { old.at = atFor(date); old.slot = null }
      Object.assign(old, fields, { end: old.at + mins * 60000 }); D.workouts.sort((a, b) => a.at - b.at);
    } else {
      const at = atFor(date);
      const w = { id: uid(), kind: 'timed', at, end: at + mins * 60000, slot: date === ymd() && el.dataset.slot || null, ...fields };
      addWorkout(w);
      if (SESSIONS[sid].fb) { save(); render(); fbSheet(w.id); return }
    }
    save(); closeSheet(); render(); toast(old ? 'Updated' : 'Logged 👍');
  },
  checkin(el) { D.checkins = byDate(D.checkins, ymd(), { date: ymd(), v: +el.dataset.v }); save(); closeSheet(); render(); toast(+el.dataset.v >= 4 ? 'Noted — take it easy, and do the Mobility Flow tomorrow' : 'Noted 👍') },
  checkinNow() { checkinSheet(false) },
  cardio() { cardioSheet(null) },
  saveCardio(el) {
    const mins = parseInt($('#cMin').value), date = $('#cDate').value || ymd(), dist = num($('#cDist').value);
    const typed = $('#cKind').value.trim(), activity = ACTIVITIES.find(a => a.toLowerCase() === typed.toLowerCase()) || typed;
    if (!activity) { toast('Type or tap what you did'); return }
    if (!(mins > 0)) { toast('Enter how many minutes'); return }
    addWorkout({ id: uid(), kind: 'cardio', at: atFor(date), date, slot: date === ymd() && el.dataset.slot || null, activity, minutes: mins, distance: dist && dist > 0 ? r1(dist) : null });
    save(); closeSheet(); render(); toast('Logged 👍');
  },
  weight() { weightSheet() },
  saveWeight() {
    const v = num($('#wVal').value), date = $('#wDate').value || ymd();
    if (!(v > 0)) { toast('Enter your weight'); return }
    D.weights = byDate(D.weights, date, { date, v: r1(v) }); save(); closeSheet(); render(); toast('Weight logged');
  },
  delweight(el) { if (confirm('Delete this weigh-in?')) { D.weights = D.weights.filter(w => w.date !== el.dataset.date); save(); render() } },
  delw(el) { if (confirm('Delete this session?')) { D.workouts = D.workouts.filter(w => w.id !== el.dataset.id); save(); render() } },
  close() { closeSheet() },
  export() { exportData() },
  import() { $('#importFile').click() },
  erase() {
    if (!confirm('Erase all sessions, weigh-ins and settings from this phone? This cannot be undone.')) return;
    localStorage.removeItem(KEY); D = defaults(); stopRest(); if (P) { clearInterval(pTick); P = null } letSleep(); tab = 'today'; render();
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { go(t.dataset.tab); return }
  const a = e.target.closest('[data-act]'); if (a && actions[a.dataset.act]) actions[a.dataset.act](a);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'cuMin' && D.active) { D.active.mins = num(el.value); save(); return }
  if (el.dataset.f && D.active) { D.active.exercises[el.dataset.e].sets[el.dataset.s][el.dataset.f] = num(el.value); save() }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'exSel') { selEx = el.value; render(); return }
  if (el.id === 'calSel') { selCal = el.value; render(); return }
  if (el.id === 'lSid') { syncRounds(); if (el.dataset.fresh) { $('#lRounds').value = roundsOf(el.value); $('#lMin').value = minsOf(SESSIONS[el.value]) } return }
  if (el.id === 'importFile' && el.files[0]) {
    el.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!d || !Array.isArray(d.workouts) || !Array.isArray(d.weights)) throw new Error('bad file');
      if (!confirm(`Replace everything on this phone with this backup (${d.workouts.length} sessions, ${d.weights.length} weigh-ins)?`)) return;
      const base = defaults(); D = { ...base, ...d, settings: { ...base.settings, ...d.settings }, onboarded: true };
      save(); tab = 'today'; render(); toast('Backup restored');
    }).catch(() => toast("That file isn't a FitTrack backup")).finally(() => el.value = '');
    return;
  }
  const k = el.dataset.set; if (!k) return;
  if (k === 'hspu') { D.hspu = +el.value; save(); render(); toast('Saved'); return }
  const v = k === 'goal' || k === 'rest' || k === 'prep' ? +el.value : el.value;
  if (k === 'unit' && v !== D.settings.unit) convertUnits(v);
  D.settings[k] = v; save(); render(); toast('Saved');
});
// close sheets with Escape on desktop
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet() });

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
